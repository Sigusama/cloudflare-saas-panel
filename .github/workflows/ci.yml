name: Verify and publish
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check browser scripts and translations
        run: |
          node --check public/assets/app.js
          node --check public/assets/i18n.js
          node tests/i18n.js
      - name: Build and verify isolated Docker installation
        run: sh tests/docker-smoke.sh
  publish-image:
    needs: docker-smoke
    if: github.repository == 'Sigusama/cloudflare-saas-panel' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate image version
        id: image
        env:
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'
          if [ "${REF#refs/tags/}" != "$REF" ]; then test "$REF" = "refs/tags/v$version"; fi
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]'):$version"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR for this repository
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish versioned image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker build --label "org.opencontainers.image.version=$(cat VERSION)" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Verify installation from the published image
        env:
          PANEL_SMOKE_IMAGE: ${{ steps.image.outputs.name }}
        run: sh tests/docker-smoke.sh
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
